# Cấu hình gửi email OTP (SMTP).
# Với Gmail: bật xác minh 2 bước rồi tạo "Mật khẩu ứng dụng" (App password) tại
#   https://myaccount.google.com/apppasswords  -> dán 16 ký tự vào mail.password (không dùng mật khẩu Gmail thường).
# Nếu để nguyên "your_..." thì ứng dụng chạy ở chế độ DEV: OTP được in ra console của Tomcat, không gửi email.
# Có thể dùng biến môi trường MAIL_USERNAME / MAIL_PASSWORD thay cho 2 dòng dưới (an toàn hơn khi đẩy lên GitHub).
mail.username=your_account@gmail.com
mail.password=
mail.from=your_nryatu@gmail.com
mail.from.name=shopping

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
